server {
    listen 80;
    listen [::]:80;
    server_name 82.115.51.36;

    root /var/www/portfolio;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location = /index.html { add_header Cache-Control "no-cache"; }
    # file names carry a content hash, so they never change: cache for a year
    location /a/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
