server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name 82.115.51.36 raykhan.uz www.raykhan.uz;

    root /var/www/portfolio;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/raykhan.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raykhan.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/html text/css application/javascript image/svg+xml;

    location = /index.html { add_header Cache-Control "no-cache"; }
    # file names carry a content hash, so they never change: cache for a year
    location /a/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 82.115.51.36 raykhan.uz www.raykhan.uz;

    return 301 https://raykhan.uz$request_uri;
}
